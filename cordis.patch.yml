# dsh-plugin-prompt-enhancer bundle layer: inserts the /enhance command plugin.
# Override any field from the profile's own cordis.patch.yml by id.
- insert:
    - id: prompt-enhancer
      name: dsh-plugin-prompt-enhancer
      config:
        # provider + model must be set together; a set pair pins the route.
        # Leave both unset to fall back through the session's logged model
        # route and the DSH runtime/desktop default model (recommended).
        # provider: ''
        # model: ''
        maxOutputTokens: 2000
        # End-to-end deadline (ms); corrective retries share this one budget.
        # Invalid values fall back to 45000. Legacy alias: timeoutMs.
        timeout: 45000
        # Reasoning tokens share maxOutputTokens; 'off' keeps the whole budget
        # for the rewrite (a truncation still retries once with a doubled cap).
        reasoningEffort: off
        # Context pack: the harness inspects the workspace itself (skeleton,
        # manifests, README, test clues, git history, keyword-located files), so
        # the model resolves facts and cites real paths instead of guessing.
        # Raising these costs input tokens on every enhancement; the pack stops
        # at maxContextChars regardless.
        maxContextChars: 10000
        inventoryDepth: 2
        inventoryScanDepth: 4
        entitySearchEnabled: true
        gitLogCount: 5
